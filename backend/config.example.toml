[qdrant]
url = "http://localhost:6334"
collection = "prompt_improver"
seed = true
embedding_dimension = 1024

[redis]
url = "redis://127.0.0.1/"
key_prefix = "prompt-improver"

[embedding]
endpoint = "http://localhost:8080/v1/embeddings"
model = "Qwen/Qwen3-Embedding-0.6B"
device = "cuda"
dimension = 1024
batch_size = 8
normalize = true

[analyst]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
temperature = 0.2
max_tokens = 512
max_turns = 4

[optimizer]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
temperature = 0.2
max_tokens = 512

[curator]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
temperature = 0.2
max_tokens = 512

[logging]
level = "info"
